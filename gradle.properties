# --- Build performance ---------------------------------------------------------
# More heap + parallel GC so big Kotlin/KSP/Compose compilations don't stall on GC.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Run independent module tasks in parallel (we only have :app today, but free for later).
org.gradle.parallel=true
# Reuse task outputs across builds (local build cache).
org.gradle.caching=true
# Skip the configuration phase when nothing affecting it changed — the biggest win for
# repeated incremental builds. Disable these two lines if a plugin ever rejects it.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# --- Android / Kotlin ----------------------------------------------------------
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Don't generate per-module BuildConfig/resvalues we don't use.
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
# Kotlin incremental compilation (default on; pinned for clarity).
kotlin.incremental=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
